services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wj-cafe-app
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      - APP_NAME=${APP_NAME:-WhiteJersey Cafe POS}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - ASSET_URL=${ASSET_URL:-http://localhost:8080}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/storage/app/database/database.sqlite
      - SESSION_DRIVER=database
      - CACHE_STORE=database
    volumes:
      # Persist only the SQLite DB folder (not the whole database/ dir which holds migrations)
      - db_data:/var/www/html/storage/app/database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    networks:
      - wj-cafe-network

volumes:
  db_data:
    driver: local

networks:
  wj-cafe-network:
    driver: bridge
